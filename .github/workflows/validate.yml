name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate upstream locks and empty sidecar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path('.').rglob('*.json')):
              json.loads(path.read_text(encoding='utf-8'))

          mathlib = json.loads(Path('upstream/mathlib4.lock.json').read_text(encoding='utf-8'))
          mil = json.loads(Path('upstream/mathematics-in-lean.lock.json').read_text(encoding='utf-8'))
          assert mathlib['commit'] == '0698b5ef086b71bfc4fe795e0a713d745094e19f'
          assert mathlib['tree'] == '57f5b41051be96ffe5298662843e1251e4466a8f'
          assert mil['commit'] == 'dd6d752fedb14082f557913c2dccb2d4851e5173'
          assert mil['tree'] == '757ef238a7e2ded30db5b3d388ff299fc28f23d5'
          assert mathlib['license']['spdx'] == mil['license']['spdx'] == 'Apache-2.0'

          translations = json.loads(Path('registry/translations.json').read_text(encoding='utf-8'))
          releases = json.loads(Path('registry/releases.json').read_text(encoding='utf-8'))
          assert translations['records'] == []
          assert releases['releases'] == []
          assert not list(Path('.').rglob('*.lean')), 'formal Lean payload is not allowed in this sidecar'
          print('validated two Apache upstream locks and an empty declaration-ID sidecar')
          PY
